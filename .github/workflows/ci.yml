name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Les données construites étant versionnées, ni OFGL ni OpenFisca ne sont
      # sollicités ici : la vérification reste hors ligne et reproductible.
      - name: Contrôles de cohérence et de comportement
        run: npm test

      - name: Types et construction
        run: npm run build
