<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- L'URL porte le scénario de l'utilisateur : elle ne doit jamais partir
         dans un en-tête Referer vers un site tiers. Chaque lien externe porte
         déjà rel="noreferrer" ; cette politique globale couvre en outre tout
         lien futur où l'attribut serait oublié. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Ni le nom de l'État ni son identité visuelle ne doivent apparaître ici :
         ce projet est indépendant, et la Licence Ouverte sous laquelle les
         données sont réutilisées interdit de laisser croire à un statut officiel
         ou à un aval de leur producteur. -->
    <title>Finances publiques — explorateur et simulateur indépendant</title>
    <meta
      name="description"
      content="Explorateur indépendant des finances publiques françaises à partir de données ouvertes, du niveau global jusqu'à la commune. Sans lien avec une administration."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
